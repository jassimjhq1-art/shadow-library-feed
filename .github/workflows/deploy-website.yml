name: Publish Shadow Library website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shadow-library-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public website source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages if permitted
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build minimal static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          cp -r covers site/covers
          touch site/.nojekyll
          test -s site/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
