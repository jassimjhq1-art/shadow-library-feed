name: Validate public library catalog
on:
  push:
    branches: [main]
    paths:
      - catalog.json
      - scripts/verify_feed.py
      - .github/workflows/validate-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog JSON
        run: python3 scripts/verify_feed.py
